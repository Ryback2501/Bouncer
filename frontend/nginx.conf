server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # CSP for the admin SPA. connect-src 'self' assumes the API is served on the SAME
    # origin (a proxy/ingress routes /api, /auth, /admin to the backend, as the SPA uses
    # relative URLs). If the API lives on a different origin, add it to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Reverse-proxy the API surface to the backend container on the compose network.
    # The SPA uses same-origin relative URLs (/admin, /auth, /api), and the CSP above is
    # connect-src 'self' — these locations are what make that contract real.
    location ~ ^/(admin|auth|api)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;
        proxy_redirect off;
    }

    # Serve static assets with long cache. NOTE: an add_header in a location block drops the
    # server-level headers, so re-assert nosniff here (it matters most for served JS).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # All other routes → index.html (SPA client-side routing). Inherits the security headers above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
