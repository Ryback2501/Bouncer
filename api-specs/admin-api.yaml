openapi: 3.1.0
info:
  title: Bouncer Admin API
  description: |
    REST API for managing applications, roles, users, API keys, and invitations.
    All endpoints require authentication via OAuth session cookie (Google, Microsoft, GitHub, or LinkedIn).
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: auth
    description: OAuth authentication
  - name: dashboard
    description: Dashboard statistics and current user
  - name: applications
    description: Application management
  - name: roles
    description: Role management
  - name: users
    description: User management
  - name: assignments
    description: Role assignment management
  - name: api-keys
    description: API key management
  - name: invitations
    description: Invitation management
  - name: admins
    description: Global admin listing

components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        customId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            roles:
              type: integer
            userRoles:
              type: integer
            apiKeys:
              type: integer

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        customId:
          type: string
        applicationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, 'null']
        sub:
          type: string
        provider:
          type: string
        isGlobalAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        active:
          type: boolean
        expiredAt:
          type: [string, 'null']
          format: date-time
        assignedAt:
          type: string
          format: date-time
        application:
          $ref: '#/components/schemas/Application'
        role:
          $ref: '#/components/schemas/Role'

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        label:
          type: [string, 'null']
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        createdById:
          type: string
          format: uuid
        usedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
    Forbidden:
      description: Action not allowed on protected resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie obtained after OAuth login

security:
  - sessionCookie: []

paths:

  # ── Auth ────────────────────────────────────────────────────────────────────

  /auth/google:
    get:
      tags: [auth]
      summary: Initiate Google OAuth login
      security: []
      parameters:
        - in: query
          name: invite
          schema:
            type: string
          description: Optional invitation token
      responses:
        '302':
          description: Redirect to Google OAuth

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth callback
      security: []
      responses:
        '302':
          description: Redirect to frontend on success or /login on failure

  /auth/microsoft:
    get:
      tags: [auth]
      summary: Initiate Microsoft OAuth login
      security: []
      parameters:
        - in: query
          name: invite
          schema:
            type: string
          description: Optional invitation token
      responses:
        '302':
          description: Redirect to Microsoft OAuth

  /auth/microsoft/callback:
    get:
      tags: [auth]
      summary: Microsoft OAuth callback
      security: []
      responses:
        '302':
          description: Redirect to frontend on success or /login on failure

  /auth/github:
    get:
      tags: [auth]
      summary: Initiate GitHub OAuth login
      security: []
      parameters:
        - in: query
          name: invite
          schema:
            type: string
          description: Optional invitation token
      responses:
        '302':
          description: Redirect to GitHub OAuth

  /auth/github/callback:
    get:
      tags: [auth]
      summary: GitHub OAuth callback
      security: []
      responses:
        '302':
          description: Redirect to frontend on success or /login on failure

  /auth/linkedin:
    get:
      tags: [auth]
      summary: Initiate LinkedIn OAuth login
      security: []
      parameters:
        - in: query
          name: invite
          schema:
            type: string
          description: Optional invitation token
      responses:
        '302':
          description: Redirect to LinkedIn OAuth

  /auth/linkedin/callback:
    get:
      tags: [auth]
      summary: LinkedIn OAuth callback
      security: []
      responses:
        '302':
          description: Redirect to frontend on success or /login on failure

  /auth/invite/{token}:
    get:
      tags: [auth]
      summary: Check invitation validity
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  expiresAt:
                    type: [string, 'null']
                    format: date-time

  /auth/logout:
    get:
      tags: [auth]
      summary: Logout current user
      responses:
        '302':
          description: Redirect to /login

  # ── Dashboard ────────────────────────────────────────────────────────────────

  /admin/me:
    get:
      tags: [dashboard]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/dashboard:
    get:
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        '200':
          description: Counts of main resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: integer
                  users:
                    type: integer
                  roles:
                    type: integer
                  assignments:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Applications ─────────────────────────────────────────────────────────────

  /admin/applications:
    get:
      tags: [applications]
      summary: List all applications
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [applications]
      summary: Create application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, customId]
              properties:
                name:
                  type: string
                customId:
                  type: string
      responses:
        '201':
          description: Created application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/applications/{appId}:
    parameters:
      - in: path
        name: appId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [applications]
      summary: Get application by ID
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [applications]
      summary: Update application
      description: The built-in Bouncer application cannot be modified (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                customId:
                  type: string
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [applications]
      summary: Delete application
      description: The built-in Bouncer application cannot be deleted (403).
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Roles ────────────────────────────────────────────────────────────────────

  /admin/applications/{appId}/roles:
    parameters:
      - in: path
        name: appId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [roles]
      summary: List roles for an application
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [roles]
      summary: Create role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, customId]
              properties:
                name:
                  type: string
                customId:
                  type: string
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/applications/{appId}/roles/{roleId}:
    parameters:
      - in: path
        name: appId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: roleId
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [roles]
      summary: Update role
      description: The built-in Bouncer admin role cannot be modified (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                customId:
                  type: string
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [roles]
      summary: Delete role
      description: The built-in Bouncer admin role cannot be deleted (403).
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Users ────────────────────────────────────────────────────────────────────

  /admin/users:
    get:
      tags: [users]
      summary: List users with pagination and search
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Filter by name, email, or sub
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sub, provider]
              properties:
                name:
                  type: string
                sub:
                  type: string
                provider:
                  type: string
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [users]
      summary: Get user by ID
      responses:
        '200':
          description: User with role assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      userRoles:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserRole'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [users]
      summary: Update user
      description: Global admin users cannot be modified (403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sub:
                  type: string
                provider:
                  type: string
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [users]
      summary: Delete user
      description: Global admin users cannot be deleted (403).
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Role Assignments ──────────────────────────────────────────────────────────

  /admin/users/{userId}/roles:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [assignments]
      summary: List role assignments for a user
      responses:
        '200':
          description: List of role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRole'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/users/{userId}/roles/{appId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: appId
        required: true
        schema:
          type: string
          format: uuid

    put:
      tags: [assignments]
      summary: Assign or update role for user in application
      description: One role per user per application. Upserts the assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  format: uuid
                active:
                  type: boolean
                  default: true
                expiredAt:
                  type: [string, 'null']
                  format: date-time
      responses:
        '200':
          description: Created or updated assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRole'
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [assignments]
      summary: Remove role assignment for user in application
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── API Keys ─────────────────────────────────────────────────────────────────

  /admin/applications/{appId}/api-keys:
    parameters:
      - in: path
        name: appId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [api-keys]
      summary: List API keys for an application
      responses:
        '200':
          description: List of API keys (hashes not returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [api-keys]
      summary: Create API key
      description: The raw key is returned only once and cannot be retrieved again.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
      responses:
        '201':
          description: Created API key
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      key:
                        type: string
                        description: Raw API key (only shown once, starts with "bncr_")
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/applications/{appId}/api-keys/{keyId}:
    parameters:
      - in: path
        name: appId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: keyId
        required: true
        schema:
          type: string
          format: uuid

    delete:
      tags: [api-keys]
      summary: Delete API key
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Invitations ───────────────────────────────────────────────────────────────

  /admin/invitations:
    get:
      tags: [invitations]
      summary: List all invitations
      responses:
        '200':
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [invitations]
      summary: Create invitation
      description: Generates a unique token valid for 24 hours.
      responses:
        '201':
          description: Created invitation with token and invite URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invitation'
                  - type: object
                    properties:
                      inviteUrl:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/invitations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid

    delete:
      tags: [invitations]
      summary: Delete invitation
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Admins ────────────────────────────────────────────────────────────────────

  /admin/admins:
    get:
      tags: [admins]
      summary: List global admins
      description: Returns all users assigned to the Bouncer admin role.
      responses:
        '200':
          description: List of admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Health ────────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: []
      summary: Health check
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
