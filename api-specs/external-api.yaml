openapi: 3.1.0
info:
  title: Bouncer External API
  description: |
    Server-to-server API for applications integrated with Bouncer. It lets your backend:

    - check whether a given user has an active role in your application
      (`GET /api/v1/access`), and
    - onboard new users by minting single-use invitations that Bouncer accepts through
      its own OAuth flow (`POST /api/v1/invitations`).

    ## Authentication
    Every request must include a valid API key in the `Authorization` header:
    ```
    Authorization: Bearer bncr_<key>
    ```
    API keys are created in the Bouncer admin UI and are scoped to a single application.
    A key may have an optional expiry; once past it, requests are rejected with
    `401 api_key_expired`.

    ## Usage flow
    1. A Bouncer admin registers your application (custom ID, allowed redirect URIs, roles)
       and issues an API key.
    2. When you want to grant access to a new end-user, mint an invitation via
       `POST /api/v1/invitations` with the role's `customId` (and optionally a `redirectUri`).
       Bouncer returns a single-use `inviteUrl`.
    3. Deliver `inviteUrl` to the user — email, in-app message, whatever your product uses.
       Bouncer does not send it for you.
    4. The user opens `inviteUrl`, lands on a Bouncer-hosted page, and signs in with an OAuth
       provider. Bouncer creates (or finds) the user, assigns the requested role within your
       application, marks the invitation used, and redirects the browser to `redirectUri`
       (or to a Bouncer-hosted confirmation page if `redirectUri` was omitted).
    5. From your backend, verify access on subsequent visits with
       `GET /api/v1/access?sub=<sub>`. Pass `provider` too if the same `sub` could collide
       across OAuth providers.

    ## How the `sub` lines up
    Bouncer keys users on the OAuth `sub` claim of the provider they signed in with during
    invitation acceptance. The same `sub` your application receives from its own OAuth login
    is the value to send to `/api/v1/access` — that is how Bouncer recognises the user across
    the two systems.
  version: 0.3.0

servers:
  - url: http://localhost:3000
    description: Local development

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key generated in the Admin UI (starts with "bncr_")

  schemas:
    AccessGranted:
      type: object
      properties:
        sub:
          type: string
          description: Subject identifier of the user
          example: "109876543210"
        application:
          type: object
          properties:
            id:
              type: string
              format: uuid
            customId:
              type: string
              example: my-app
            name:
              type: string
              example: My App
        role:
          type: object
          properties:
            id:
              type: string
              format: uuid
            customId:
              type: string
              example: editor
            name:
              type: string
              example: Editor

    Error:
      type: object
      properties:
        error:
          type: string

    ValidationError:
      type: object
      description: Returned when query parameters fail validation (Zod).
      properties:
        error:
          type: string
          example: validation_error
        issues:
          type: array
          description: One entry per failed validation rule.
          items:
            type: object
            properties:
              code:
                type: string
                example: too_small
              path:
                type: array
                items:
                  type: string
                example: [sub]
              message:
                type: string
                example: "Too small: expected string to have >=1 characters"

    InvitationRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: customId of a role within the application this API key belongs to.
          example: editor
        redirectUri:
          type: string
          format: uri
          description: >-
            Where to send the user after they accept. Its origin must match one of the
            application's registered redirect URIs (configured in the Bouncer admin UI). If
            omitted, Bouncer shows a confirmation page.
          example: "https://app.example.com/welcome"

    InvitationCreated:
      type: object
      properties:
        inviteUrl:
          type: string
          format: uri
          description: Single-use URL to deliver to the user; they accept by signing in with an OAuth provider.
          example: "http://localhost:5173/invite/3f1a9c0b...e9"
        expiresAt:
          type: string
          format: date-time
          description: When the invitation expires (24h after creation).
          example: "2026-05-26T09:24:16.000Z"

security:
  - apiKey: []

paths:
  /api/v1/access:
    get:
      summary: Check user access
      description: |
        Checks whether the user identified by `sub` (and optionally `provider`) has
        an active, non-expired role in the application associated with the API key.

        Possible outcomes:
        - **200** — user has an active role → returns role and application details.
        - **400** — query validation failed (e.g. `sub` missing or empty).
        - **401** — API key is missing or invalid.
        - **403** — user has a role but it is inactive or expired.
        - **404** — user not found, or user has no role in this application.
      parameters:
        - in: query
          name: sub
          required: true
          schema:
            type: string
          description: Subject identifier of the user (from the OAuth provider)
          example: "109876543210"
        - in: query
          name: provider
          required: false
          schema:
            type: string
          description: |
            OAuth provider name (e.g. `google`, `microsoft`, `apple`).
            Required only when the same `sub` exists across multiple providers.
          example: google
      responses:
        '200':
          description: User has an active role in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGranted'
              example:
                sub: "109876543210"
                application:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  customId: my-app
                  name: My App
                role:
                  id: "f0e1d2c3-b4a5-6789-abcd-ef0987654321"
                  customId: editor
                  name: Editor
        '400':
          description: Query parameters failed validation (e.g. `sub` missing or empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                error: validation_error
                issues:
                  - code: invalid_type
                    path: [sub]
                    message: "Invalid input: expected string, received undefined"
        '401':
          description: Missing, invalid, or expired API key (`invalid_api_key` | `api_key_expired`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_api_key
        '403':
          description: User's role is inactive or expired
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      expiredAt:
                        type: [string, 'null']
                        format: date-time
              example:
                error: role_inactive
                expiredAt: "2026-01-01T00:00:00.000Z"
        '404':
          description: User not found or has no role in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: user_not_found

  /api/v1/invitations:
    post:
      summary: Create a user invitation
      description: |
        Mint a single-use invitation for the application associated with the API key. Deliver the
        returned `inviteUrl` to the user; when they open it and sign in via an OAuth provider on
        the Bouncer-hosted accept page, Bouncer creates (or finds) the user, assigns the requested
        role within this application, and redirects them to `redirectUri` (or to a Bouncer
        confirmation page if omitted).

        Outcomes:
        - **201** — invitation created.
        - **400** — body validation failed, or `redirectUri`'s origin is not in the application's allowlist.
        - **401** — API key is missing or invalid.
        - **404** — no role with that `customId` exists in this application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
              example:
                inviteUrl: "http://localhost:5173/invite/3f1a9c0b...e9"
                expiresAt: "2026-05-26T09:24:16.000Z"
        '400':
          description: Validation failed, or redirect URI origin not in the application allowlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: redirect_uri_not_allowed
        '401':
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_api_key
        '404':
          description: Role not found in this application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: role_not_found
