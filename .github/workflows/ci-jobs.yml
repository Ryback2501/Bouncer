name: CI jobs

on:
  workflow_call: {}

permissions:
  contents: read


jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bouncer
          POSTGRES_PASSWORD: bouncer
          POSTGRES_DB: bouncer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bouncer:bouncer@localhost:5432/bouncer_test
      SESSION_SECRET: ci-session-secret-minimum-sixteen-chars
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: backend
        run: npm run test:run

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Security audit
        working-directory: backend
        run: npm audit --audit-level=high

  frontend:
    name: Frontend (typecheck, lint, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Security audit
        working-directory: frontend
        run: npm audit --audit-level=high

  integration:
    name: Backend integration tests (real DB)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bouncer
          POSTGRES_PASSWORD: bouncer
          POSTGRES_DB: bouncer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bouncer:bouncer@localhost:5432/bouncer_test
      SESSION_SECRET: ci-session-secret-minimum-sixteen-chars
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: integration

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bouncer
          POSTGRES_PASSWORD: bouncer
          POSTGRES_DB: bouncer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bouncer:bouncer@localhost:5432/bouncer_test
      SESSION_SECRET: ci-session-secret-minimum-sixteen-chars
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
      # Backend serves the built SPA from this path. The same single-origin setup that
      # ships in the production Docker image — keeps e2e exercising what users hit.
      STATIC_DIR: ${{ github.workspace }}/frontend/dist

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Copy Prisma client to e2e
        run: cp -r backend/node_modules/.prisma e2e/node_modules/

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend (serves API + built SPA)
        working-directory: backend
        run: npm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:3000/health http://localhost:3000 --timeout 30000

      - name: Run E2E tests
        working-directory: e2e
        run: npm run test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest

    # CI-safe credentials passed both to the postgres init (via compose's interpolation of
    # POSTGRES_USER/PASSWORD/DB) and built into the in-container DATABASE_URL the same way.
    env:
      POSTGRES_USER: bouncer
      POSTGRES_PASSWORD: bouncer
      POSTGRES_DB: bouncer

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@v4

      - name: Write CI-safe backend/.env.docker
        run: |
          {
            echo "NODE_ENV=test"
            echo "PORT=3000"
            echo "FRONTEND_URL=http://localhost"
            echo "SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')"
            echo "ADMIN_ALLOWED_EMAILS="
            echo "POSTGRES_USER=${POSTGRES_USER}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "POSTGRES_DB=${POSTGRES_DB}"
          } > backend/.env.docker

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for /health and /
        run: npx --yes wait-on http://localhost/health http://localhost --timeout 60000

      - name: Smoke assertions
        run: |
          set -euo pipefail
          curl -fsS http://localhost/health | grep -q '"status":"ok"'
          curl -fsS http://localhost/health | grep -q '"db":"ok"'
          curl -fsS http://localhost/ | grep -q '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/admin/applications)" = "401"

      - name: Dump compose logs on failure
        if: failure()
        run: |
          mkdir -p .docker-validate-logs
          docker compose logs --no-color --tail=200 > .docker-validate-logs/compose-logs.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs
          path: .docker-validate-logs/
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose down -v
