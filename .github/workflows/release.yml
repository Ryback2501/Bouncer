name: Release

# Fires on every push to main (i.e. after a dev->main fast-forward). Tags the version,
# builds & uploads the backend/frontend release artifacts, creates the GitHub Release, and —
# only when DOCKERHUB_PUBLISH=true — publishes the multi-arch image to Docker Hub.
# Template workflow ported to Bouncer (no GitHub Pages deploy: Bouncer ships as an image).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: version
        run: |
          VERSION=$(node -p "require('./backend/package.json').version")
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "error: could not parse a semver version from backend/package.json"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  create-tag:
    name: Create version tag
    needs: [read-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Tag v$VERSION
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

  create-artifacts:
    name: Build & zip artifacts
    needs: [read-version]
    runs-on: ubuntu-latest
    env:
      # Required for prisma generate / config.ts validation during the build
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      SESSION_SECRET: build-secret-placeholder-not-used-at-runtime
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Package backend artifact
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          mkdir -p artifacts
          cd backend
          zip -r "../artifacts/bouncer-backend-v${VERSION}.zip" \
            dist/ \
            package.json \
            package-lock.json \
            prisma/schema.prisma \
            prisma/migrations/

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package frontend artifact
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          cd frontend
          zip -r "../artifacts/bouncer-frontend-v${VERSION}.zip" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*.zip
          retention-days: 7

  docker-publish:
    name: Publish image to Docker Hub (gated)
    needs: [read-version, create-tag]
    runs-on: ubuntu-latest
    if: vars.DOCKERHUB_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the same repo-root Dockerfile we ship for self-host (single image: Express
      # serves the SPA + API), but for two architectures so it can run on cloud x86 and on
      # ARM hosts (Oracle Cloud Free Tier Ampere, AWS Graviton, Apple Silicon, Pi 4/5).
      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bouncer:${{ needs.read-version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bouncer:latest

  docker-publish-disabled:
    name: Publish image to Docker Hub (gated — DISABLED)
    needs: [read-version]
    runs-on: ubuntu-latest
    if: vars.DOCKERHUB_PUBLISH != 'true'
    steps:
      - run: echo "DOCKERHUB_PUBLISH repo variable is not 'true' — Docker Hub publish skipped."

  github-release:
    name: GitHub Release
    needs: [read-version, create-tag, create-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          gh release create "v$VERSION" --generate-notes --title "v$VERSION" \
            "artifacts/bouncer-backend-v${VERSION}.zip" \
            "artifacts/bouncer-frontend-v${VERSION}.zip"
