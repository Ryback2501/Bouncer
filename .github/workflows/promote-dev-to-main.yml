name: Promote dev to main (release PR)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.3 — no v prefix)'
        required: true
      release_notes:
        description: 'Release notes (optional)'
        required: false
        default: ''


jobs:
  create-pr:
    name: Bump version and create release PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # GH_PAT (not GITHUB_TOKEN) so the version-bump push and the opened PR both
      # trigger ci-jobs.yml — PRs created with GITHUB_TOKEN do not start workflows.
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: dev
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in package.json files
        run: |
          node -e "
            const fs = require('fs');
            ['backend/package.json', 'frontend/package.json'].forEach(f => {
              const pkg = JSON.parse(fs.readFileSync(f, 'utf8'));
              pkg.version = '${{ inputs.version }}';
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + '\n');
            });
          "

      - name: Commit and push version bump
        run: |
          git add backend/package.json frontend/package.json
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ inputs.version }}"
          git push origin dev

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          BODY="Release \`v${{ inputs.version }}\` — merging \`dev\` into \`main\`."
          if [ -n "$RELEASE_NOTES" ]; then
            BODY="$BODY

          **Release notes:** $RELEASE_NOTES"
          fi

          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Release PR #$EXISTING already exists — skipping"
          else
            gh pr create \
              --base main --head dev \
              --title "Release v${{ inputs.version }}" \
              --body "$BODY"
          fi
